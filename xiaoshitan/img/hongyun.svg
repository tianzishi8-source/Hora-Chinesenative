<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Songti SC,Noto Serif SC,STSong,serif">
<defs>
<radialGradient id="ink" cx="50%" cy="50%" r="50%">
<stop offset="0.36" stop-color="#f7f2e6"/>
<stop offset="0.42" stop-color="#9aa29c"/>
<stop offset="0.7" stop-color="#6f7a75"/>
<stop offset="1" stop-color="#4b5652"/>
</radialGradient>
<filter id="soft"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="38"/></filter>
<mask id="hole"><rect width="800" height="400" fill="#fff"/><circle cx="600" cy="170" r="70" fill="#000"/></mask></defs>
<rect width="800" height="400" fill="#f7f2e6"/>
<rect x="20" y="20" width="360" height="300" rx="6" fill="#f7f2e6" stroke="#d9cdb5"/>
<circle cx="200" cy="170" r="70" fill="#f9f5ea" stroke="#e8dfcc" stroke-width="1" stroke-dasharray="4 6"/>
<text x="200" y="356" text-anchor="middle" font-size="22" fill="#5b524a">直接画：白纸上的白月亮，看不出</text>
<rect x="420" y="20" width="360" height="300" rx="6" fill="#f7f2e6" stroke="#d9cdb5"/>

<rect x="420" y="20" width="360" height="300" rx="6" fill="url(#ink)" filter="url(#soft)" opacity=".9" mask="url(#hole)"/>


<text x="600" y="356" text-anchor="middle" font-size="22" fill="#5b524a">烘云托月：月亮没画，只染四周的云</text>
<text x="400" y="392" text-anchor="middle" font-size="15" fill="#8a7f72">示意图</text>
</svg>
