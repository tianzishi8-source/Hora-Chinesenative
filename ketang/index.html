<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>弦歌 · 课堂投屏</title>
<style>
@font-face{font-family:"WenKai";src:url("../yueyanglou/font/wenkai.woff2") format("woff2")}
:root{--paper:#f2ead8;--ink:#2a241b;--muted:#6f6455;--line:#d6c9ac;--zhu:#a3382a}
body{margin:0;background:var(--paper) url(../img/paper.webp);background-size:512px;color:var(--ink);font:17px/1.7 "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:760px;margin:0 auto;padding:40px 16px 60px}
h1{font-family:"WenKai",serif;font-weight:400;font-size:46px;margin:0}
.sub{color:var(--muted);margin:4px 0 26px}
.card{background:#fffaf0;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.card h2{font-family:"WenKai",serif;font-weight:400;font-size:28px;margin:0 0 4px}
.card p{margin:0 0 12px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px}
a.btn{display:inline-block;text-decoration:none;border-radius:8px;padding:7px 18px;font-weight:700;background:var(--ink);color:#f6efe0}
a.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.note{font-size:15px;color:var(--muted);border-left:3px solid var(--zhu);padding-left:12px;margin-top:26px}
</style>
</head>
<body>
<main>
  <h1>课堂投屏</h1>
  <p class="sub">一块屏幕、一位助教、学生用纸笔作答。助教只需点“继续”。</p>
  <div class="card">
    <h2>岳阳楼记 · 第1节</h2>
    <p>两个被贬的人；读懂第1、2段。约 40 分钟，提问段：“衔远山，吞长江”。</p>
    <div class="row">
      <a class="btn" href="yyl-1.html">打开投屏</a>
      <a class="btn ghost" href="yyl-1-sheet.pdf">作答单（PDF，A4 双面）</a>
      <a class="btn ghost" href="yyl-1-sheet.html">作答单（网页打印）</a>
    </div>
  </div>
  <p class="note">课前：每人打印一张作答单（正面作答、背面原文和字词表），准备黑、蓝、红三色笔。<br>
  浏览器：建议用 Microsoft Edge 打开投屏，声音最自然；也可以用 Chrome。<br>
  课后：助教把每张作答单拍照上传。</p>
</main>
</body>
</html>
